name: agents

on:
  push:
    paths:
      - "agents/**"
  pull_request:
    paths:
      - "agents/**"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run pytest -m "not anvil and not live"
